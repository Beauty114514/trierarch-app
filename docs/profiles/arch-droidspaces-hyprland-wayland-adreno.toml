# Sample only: replace id/container/user with your device values.
id = "arch-droidspaces-hyprland-wayland-adreno"
name = "Arch DroidSpaces Hyprland Wayland (Adreno)"
runtime = "droidspaces"
container = "Arch"
user = "beauty"

[display]
type = "wayland"
# Wayland only: 100 / 125 / 150 / 200 / 250 / 300 / 400
desktop_scale = 100

[launch]
argv = ["env", "GALLIUM_DRIVER=freedreno", "MESA_LOADER_DRIVER_OVERRIDE=kgsl", "dbus-run-session", "--", "start-hyprland"]

[graphics]
renderer = "adreno"

[compat]
udev_monitor = "auto"
